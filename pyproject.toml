[project]
name = "fxnext"
version = "0.1.0"
description = "FxAgent Next: deterministic FX research engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pyarrow>=17",
    "pydantic>=2.9",
    "duckdb>=1.1",
    "tzdata>=2024.1",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.32",
]

[project.scripts]
fxnext = "fxnext.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.7",
    "import-linter>=2.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxnext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP046"]  # FrozenMap keeps Generic[K, V] for pydantic compatibility

[tool.ruff.lint.per-file-ignores]
"src/fxnext/dashboard/charts.py" = ["E501"]  # SVG markup reads better on one line

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/fxnext"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "fxnext"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core puro: domain non importa altri moduli fxnext"
type = "forbidden"
source_modules = ["fxnext.domain"]
forbidden_modules = ["fxnext.strategy", "fxnext.data", "fxnext.replay", "fxnext.audit", "fxnext.research", "fxnext.cli"]

[[tool.importlinter.contracts]]
name = "Core puro: strategy dipende solo da domain"
type = "forbidden"
source_modules = ["fxnext.strategy"]
forbidden_modules = ["fxnext.data", "fxnext.replay", "fxnext.audit", "fxnext.research", "fxnext.cli"]

[[tool.importlinter.contracts]]
name = "Core puro: niente I/O, rete, storage nel core"
type = "forbidden"
source_modules = ["fxnext.domain", "fxnext.strategy"]
forbidden_modules = ["pyarrow", "duckdb", "urllib", "http", "socket", "sqlite3", "subprocess", "random", "time", "lzma"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Il simulatore (che vede il futuro) non e' importato da dati, replay o audit"
type = "forbidden"
source_modules = ["fxnext.data", "fxnext.replay", "fxnext.audit"]
forbidden_modules = ["fxnext.research"]

[[tool.importlinter.contracts]]
name = "La app web legge soltanto: niente replay, downloader, runner degli esperimenti, scrittori"
type = "forbidden"
source_modules = ["fxnext.dashboard"]
forbidden_modules = [
    "fxnext.replay",
    "fxnext.data.dukascopy",
    "fxnext.data.importers",
    "fxnext.data.store",
    "fxnext.data.path",
    "fxnext.audit.store",
    "fxnext.research.experiment",
    "fxnext.research.aggregate",
    "fxnext.cli",
    "subprocess",
]
# research.protocol (split bounds) imports the simulator's types; only direct use is forbidden
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Nessun modulo del motore dipende dalla app web"
type = "forbidden"
source_modules = ["fxnext.domain", "fxnext.strategy", "fxnext.data", "fxnext.replay", "fxnext.audit", "fxnext.research"]
forbidden_modules = ["fxnext.dashboard", "fastapi", "starlette", "jinja2", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Motore e ricerca non usano l'archivio news (entra solo con una pre-registrazione, ADR-0008)"
type = "forbidden"
source_modules = ["fxnext.domain", "fxnext.strategy", "fxnext.data", "fxnext.replay", "fxnext.audit", "fxnext.research"]
forbidden_modules = ["fxnext.news"]
